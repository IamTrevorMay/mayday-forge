name: MaydayForge
options:
  bundleIdPrefix: com.trevor
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"

targets:
  MaydayForge:
    type: application
    platform: macOS
    sources:
      - path: MaydayForge
    resources:
      - path: MaydayForge/Resources/Assets.xcassets
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.trevor.MaydayForge
        PRODUCT_NAME: "Mayday Forge"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.developer-tools"
        CODE_SIGN_ENTITLEMENTS: MaydayForge/MaydayForge.entitlements
        ENABLE_APP_SANDBOX: NO
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_REQUIRED: NO
